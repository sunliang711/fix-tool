name: mock-acceptor-basic
steps:
  - name: logon
    action: logon
    wait:
      msg_type: A
    assert:
      - field: msg_type
        equals: A

  - name: test-request
    action: test-request
    input:
      test_request_id: ping-001
    wait:
      msg_type: "0"
    assert:
      - field: "112"
        equals: ping-001

  - name: new-order
    action: order.new
    input:
      cl_ord_id: C001
      symbol: AAPL
      side: buy
      qty: "100"
      price: "10.25"
      ord_type: limit
      time_in_force: day
    wait:
      msg_type: "8"
    assert:
      - field: cl_ord_id
        equals: C001
      - field: exec_type
        equals: "0"

  - name: replace-order
    action: order.replace
    input:
      orig_cl_ord_id: C001
      cl_ord_id: C003
      symbol: AAPL
      side: buy
      qty: "150"
      price: "10.35"
      ord_type: limit
      time_in_force: day
    wait:
      msg_type: "8"
    assert:
      - field: cl_ord_id
        equals: C003
      - field: exec_type
        equals: "5"

  - name: cancel-order
    action: order.cancel
    input:
      orig_cl_ord_id: C003
      cl_ord_id: C004
      symbol: AAPL
      side: buy
    wait:
      msg_type: "8"
    assert:
      - field: cl_ord_id
        equals: C004
      - field: exec_type
        equals: "4"

  - name: logout
    action: logout
    wait:
      msg_type: "5"
